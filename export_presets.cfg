[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="levels/*.txt,levels/SOURCES.md"
exclude_filter="cloudflare/**,debug_video_frames/**,dist/**,tests/**,assets/fonts/ARCADECLASSIC*,assets/fonts/PressStart2P-Regular.ttf"
export_path="dist/web/index.html"
patches=PackedStringArray()

[preset.0.options]

custom_template/debug=""
custom_template/release="res://.godot/export_templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>(() => { const contexts = new Set(); const wrap = (name) => { const Original = window[name]; if (!Original) return; const Wrapped = function(...args) { const context = new Original(...args); contexts.add(context); return context; }; Wrapped.prototype = Original.prototype; Object.setPrototypeOf(Wrapped, Original); window[name] = Wrapped; }; wrap('AudioContext'); wrap('webkitAudioContext'); const resume = () => { for (const context of contexts) { if (context.state !== 'running') context.resume().catch(() => {}); } }; window.addEventListener('pointerdown', resume, true); window.addEventListener('touchend', resume, true); window.addEventListener('keydown', resume, true); })();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display="standalone"
progressive_web_app/orientation="any"
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
